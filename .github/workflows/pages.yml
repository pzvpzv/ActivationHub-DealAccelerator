# Deploys the static preview to GitHub Pages: Browse + Deal Accelerator in keyword mode.
# AI analysis needs the Node server (npm run dev / npm start) and is not available on Pages.
name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags and their history, so each iteration can be rebuilt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm test
      - name: Build the current version (served at the root)
        run: npm run build
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_VERSION: latest
      - name: Add catalogue and SPA fallback
        run: |
          cp content/catalogue.json dist/catalogue.json
          sed "s#__BASE__#/${{ github.event.repository.name }}/#" scripts/404.html > dist/404.html
      # Every tagged iteration stays live at /v/<tag>/, so versions can be compared
      # side by side rather than described. Each is built from its own commit.
      - name: Build each tagged iteration
        run: bash scripts/build-versions.sh "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
